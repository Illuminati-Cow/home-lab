services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    networks:
      - proxy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - DOCKER_MODS=linuxserver/mods:radarr-striptracks
    volumes:
      - /opt/stacks/arr/radarr/config:/config
      - /tank/media:/tank/media
    ports:
      - 7878:7878
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.radarr.rule=Host(`radarr.local.thepasture.uk`) || Host(`radarr.thepasture.uk`)
      - traefik.http.routers.radarr.entrypoints=https
      - traefik.http.routers.radarr.tls=true
      - traefik.http.services.radarr.loadbalancer.server.port=7878
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    networks:
      - proxy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - DOCKER_MODS=linuxserver/mods:radarr-striptracks
    volumes:
      - /opt/stacks/arr/sonarr/config:/config
      - /tank/media:/tank/media
    ports:
      - 8989:8989
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.sonarr.rule=Host(`sonarr.local.thepasture.uk`) || Host(`sonarr.thepasture.uk`)
      - traefik.http.routers.sonarr.entrypoints=https
      - traefik.http.routers.sonarr.tls=true
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
  sonarra:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarra
    networks:
      - proxy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - DOCKER_MODS=linuxserver/mods:radarr-striptracks
    volumes:
      - /opt/stacks/arr/sonarra/config:/config
      - /tank/media:/tank/media
    ports:
      - 8999:8999
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.sonarra.rule=Host(`sonarra.local.thepasture.uk`) || Host(`sonarra.thepasture.uk`)
      - traefik.http.routers.sonarra.entrypoints=https
      - traefik.http.routers.sonarra.tls=true
      - traefik.http.services.sonarra.loadbalancer.server.port=8999
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    user: "1000:1000"
    networks:
      - proxy
    environment:
      - LOG_LEVEL=debug
      - TZ=America/Los_Angeles
    ports:
      - 5055:5055
    volumes:
      - /opt/stacks/arr/jellyseerr/app/config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.seerr.rule=Host(`seerr.local.thepasture.uk`) || Host(`seerr.thepasture.uk`) || Host(`jellyseerr.local.thepasture.uk`) || Host(`jellyseerr.thepasture.uk`)
      - traefik.http.routers.seerr.entrypoints=https
      - traefik.http.routers.seerr.tls=true
      - traefik.http.services.seerr.loadbalancer.server.port=5055
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    networks:
      - proxy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - /opt/stacks/arr/prowlarr/config:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.prowlarr.rule=Host(`prowlarr.local.thepasture.uk`) || Host(`prowlarr.thepasture.uk`)
      - traefik.http.routers.prowlarr.entrypoints=https
      - traefik.http.routers.prowlarr.tls=true
      - traefik.http.services.prowlarr.loadbalancer.server.port=9696
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    networks:
      - proxy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - /opt/stacks/arr/bazarr/config:/config
      - /tank/media/movies:/tank/media/movies
      - /tank/media/shows:/tank/media/shows
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.bazarr.rule=Host(`bazarr.local.thepasture.uk`)
      - traefik.http.routers.bazarr.entrypoints=https
      - traefik.http.routers.bazarr.tls=true
      - traefik.http.services.bazarr.loadbalancer.server.port=6767
  bazarra:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarra
    networks:
      - proxy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - /opt/stacks/arr/bazarra/config:/config
      - /tank/media/anime:/tank/media/anime
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.bazarra.rule=Host(`bazarra.local.thepasture.uk`)
      - traefik.http.routers.bazarra.entrypoints=https
      - traefik.http.routers.bazarra.tls=true
      - traefik.http.services.bazarra.loadbalancer.server.port=6767
  soulsync:
    image: boulderbadgedad/soulsync:latest
    container_name: soulsync-webui
    networks:
      - proxy
    environment:
      # User/Group ID configuration
      - PUID=1000
      - PGID=1000
      - UMASK=022
      # Web server configuration
      - FLASK_ENV=production
      - PYTHONPATH=/app
      # Optional: Configure through environment variables
      - SOULSYNC_CONFIG_PATH=/app/config/config.json
      # Set timezone (change to your timezone)
      - TZ=America/Los_Angeles
    ports:
      # - "8008:8008" # Main web app
      - "8888:8888" # Spotify OAuth callback
      - "8889:8889" # Tidal OAuth callback
    volumes:
      - ./soulsync/config:/app/config
      - ./soulsync/logs:/app/logs
      - /tank/media/downloads/music:/app/downloads
      - /tank/media/downloads/staging:/app/Staging
      - ./soulsync/database:/app/data
      - /tank/media/music:/music:ro
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8008/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.http.routers.soulsync.rule=Host(`soulsync.local.thepasture.uk`)
      - traefik.http.routers.soulsync.entrypoints=https
      - traefik.http.routers.soulsync.tls=true
      - traefik.http.services.soulsync.loadbalancer.server.port=8008
networks:
  proxy:
    external: true